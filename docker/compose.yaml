services:
  ai-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ai-gateway:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_GATEWAY_PORT:-4000}:4000"
    environment:
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in docker/.env}
      AI_GATEWAY_ADMIN_KEY: ${AI_GATEWAY_ADMIN_KEY:?Set AI_GATEWAY_ADMIN_KEY in docker/.env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_GATEWAY_CONFIG: /data/config.yaml
      AI_GATEWAY_DB: /data/usage.sqlite3
    volumes:
      - gateway-data:/data
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH in docker/.env}:/certs/server.crt:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH in docker/.env}:/certs/server.key:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('https').get({host:'127.0.0.1',port:4000,path:'/health/live',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
